<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오퍼레이터 탑뷰 시제품 검수</title><style>body{background:#182124;color:#ddd;font:16px system-ui;margin:24px}canvas{width:100%;max-width:1000px;background:#353c38}label{display:inline-block;margin:12px}p{max-width:850px;line-height:1.7}</style><h1>오퍼레이터 탑뷰 시제품 검수</h1><p>빈손 원본과 런타임 총기 합성을 비교합니다. 현재 시제품은 앉기 실루엣과 손 접점이 미검증되어 경기 기본 에셋으로 등록하지 않았습니다. 격자 자동 분할 대신 실제 그림 영역을 별도로 지정했습니다.</p><label>회전 <input id="angle" type="range" min="0" max="360" value="0"></label><label><input id="gun" type="checkbox">총기 임시 합성</label><label>총기 <select id="weapon"><option value="p90">P90</option><option value="hk416">HK416</option><option value="c14">C14</option></select></label><canvas id="view" width="1000" height="500"></canvas><p>원본: 무기·가젯·로프·효과 없는 3포즈 시제품. 합성 시 팔을 늘리거나 회전하여 손잡이에 강제로 맞추지 않습니다. 무기 접점 불일치는 포즈 수정 대상으로 남깁니다.</p><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),body=new Image(),weapons={};body.src='prototype.png';const meta={p90:[33,2137,355,34],hk416:[43,2155,360,17],c14:[57,2140,350,26]};for(const id of Object.keys(meta)){let im=weapons[id]=new Image();im.src='../../operators/weapons/top/'+id+'-v1.png';im.onload=draw}body.onload=draw;
// Source bounds and helmet pivots estimated from this prototype only, not final socket data.
const poses=[{name:'대기',rect:[70,130,410,400],pivot:[310,320]},{name:'앉기',rect:[710,150,370,405],pivot:[935,342]},{name:'엎드리기',rect:[1240,165,910,400],pivot:[1985,365]}];
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#566159';for(let x=0;x<1000;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}poses.forEach((p,i)=>{ctx.save();ctx.translate(190+i*310,250);ctx.rotate(+document.querySelector('#angle').value*Math.PI/180);ctx.scale(2.4,2.4);let [x,y,w,h]=p.rect,scale=.095; if(body.complete&&body.naturalWidth)ctx.drawImage(body,x,y,w,h,(x-p.pivot[0])*scale,(y-p.pivot[1])*scale,w*scale,h*scale);if(document.querySelector('#gun').checked){const id=document.querySelector('#weapon').value,im=weapons[id],[len,mx,my,rear]=meta[id],s=len/(mx-rear);if(im.complete&&im.naturalWidth)ctx.drawImage(im,len-16-mx*s,7-my*s,im.naturalWidth*s,im.naturalHeight*s)}ctx.restore();ctx.fillStyle='#eee';ctx.font='20px system-ui';ctx.fillText(p.name,145+i*310,450)})}document.querySelectorAll('input,select').forEach(el=>el.oninput=draw);
</script></html>
